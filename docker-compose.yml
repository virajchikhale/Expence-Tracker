# cp .env.example .env  (set JWT_SECRET and MONGO_PASSWORD)  then  docker compose up -d --build
#   Frontend http://localhost:3000     API http://localhost:8000     MongoDB is internal only
# To use MongoDB Atlas instead, set MONGO_URI in .env (the mongo service is then unused).
services:
  mongo:
    # MongoDB 5+ needs a CPU with AVX; on older hardware set MONGO_IMAGE=mongo:4.4
    image: ${MONGO_IMAGE:-mongo:7}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-expense}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?set MONGO_PASSWORD in .env}
    volumes: [mongo_data:/data/db]
    healthcheck:
      # mongosh exists in 5+, the old mongo shell in 4.x
      test: ["CMD-SHELL", "SH=mongosh; command -v mongosh >/dev/null || SH=mongo; $$SH --quiet --eval 'db.adminCommand({ping:1}).ok' -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backend:
    build: ./Expence-Manager-Backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (openssl rand -hex 32)}
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_USER:-expense}:${MONGO_PASSWORD}@mongo:27017/?authSource=admin}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      DB_NAME: ${DB_NAME:-expense_tracker_db}
    ports: ["${BACKEND_BIND:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"]
    depends_on:
      mongo: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  frontend:
    build:
      context: ./Expence-Manager-Frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000}
    ports: ["${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-3000}:3000"]
    depends_on: [backend]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

volumes:
  mongo_data:
